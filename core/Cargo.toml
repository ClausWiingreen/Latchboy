[package]
name = "latchboy-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "latchboy_core"
path = "src/lib.rs"

[dependencies]
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
criterion = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[[bench]]
name = "audio_callback_stability"
harness = false

[[bench]]
name = "cpu_hotspots"
harness = false

[[bench]]
name = "emulator_step_cycles"
harness = false

[[bench]]
name = "instruction_stepping"
harness = false

[[bench]]
name = "interrupt_heavy"
harness = false

[[bench]]
name = "ppu_scanline_throughput"
harness = false
