name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    env:
      LATCHBOY_ROM_ROOT: ${{ github.workspace }}/.rom-fixtures

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Provision ROM fixtures
        run: |
          set -euo pipefail
          mkdir -p "${LATCHBOY_ROM_ROOT}/blargg" "${LATCHBOY_ROM_ROOT}/mooneye"

          curl -fsSL -o /tmp/cpu_instrs.zip \
            https://gbdev.gg8.se/files/roms/blargg-gb-tests/cpu_instrs.zip
          unzip -q /tmp/cpu_instrs.zip -d "${LATCHBOY_ROM_ROOT}/blargg"

          curl -fsSL -o /tmp/instr_timing.zip \
            https://gbdev.gg8.se/files/roms/blargg-gb-tests/instr_timing.zip
          unzip -q /tmp/instr_timing.zip -d "${LATCHBOY_ROM_ROOT}/blargg"

          git clone --depth 1 https://github.com/Gekkio/mooneye-test-suite.git /tmp/mooneye-test-suite
          cp -R /tmp/mooneye-test-suite/acceptance "${LATCHBOY_ROM_ROOT}/mooneye/"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify ROM fixture root is configured
        run: |
          if [ -z "${LATCHBOY_ROM_ROOT:-}" ]; then
            echo "LATCHBOY_ROM_ROOT must be set for milestone-gating external ROM validation."
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --all-targets
