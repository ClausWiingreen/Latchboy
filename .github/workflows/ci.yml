name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    env:
      LATCHBOY_ROM_ROOT: ${{ vars.LATCHBOY_ROM_ROOT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Lint with clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Validate external ROM fixture configuration
        run: |
          if [ -z "${LATCHBOY_ROM_ROOT}" ]; then
            echo "LATCHBOY_ROM_ROOT must be set for milestone-gating CI runs." >&2
            exit 1
          fi
          if [ ! -d "${LATCHBOY_ROM_ROOT}" ]; then
            echo "LATCHBOY_ROM_ROOT must point to an existing directory: ${LATCHBOY_ROM_ROOT}" >&2
            exit 1
          fi

      - name: Run tests
        run: cargo test --workspace --all-targets

